
<!DOCTYPE html>
<html>
<head>
<style>


/* Inline */
span.a {
    display: inline;
   
    padding: 5px;
    border: 2px solid red;
}

/* Inline-block */
span.b {
    display: inline-block;
    width: 100px;
    height: 35px;
    padding: 5px;
    border: 2px solid red;
}

/* Block */
span.c {
    display: block;
    width: 100px;
    height: 35px;
    padding: 5px;
    border: 2px solid red;
}

</style>
</head>

<body>


<h1>The display Property</h1>

<h2>display: inline</h2>

<div>
course list:
<span class="a">Python</span>
<span class="a">Java</span>

</div>

<h2>display: inline-block</h2>

<div>
course list:
<span class="b">Python</span>
<span class="b">Java</span>

</div>

<h2>display: block</h2>

<div>
course list:
<span class="c">Python</span>
<span class="c">Java</span>

</div>

</body>
</html>
