<!DOCTYPE html>
<html>
<head>
<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
}

.container {
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 20px;
}

.row {
    display: flex;
    justify-content: space-between;
}

.box1 {
    border: 15px solid green;
    padding: 20px;
    width: 200px;
}

.box2 {
    border: 15px solid red;
    padding: 20px;
    width: 200px;
}

.box3 {
    border: 15px solid deeppink;
    padding: 20px;
    width: 200px;
}

.box4 {
    border: 15px solid blue;
    padding: 20px;
    width: 200px;
}
</style>
</head>

<body>

<div class="container">

    <div class="row">
        <div class="box1">Java</div>
        <div class="box2">Python</div>
    </div>

    <div class="row">
        <div class="box3">HTML</div>
        <div class="box4">CSS</div>
    </div>

</div>

</body>
</html>
